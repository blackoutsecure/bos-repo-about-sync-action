# yamllint configuration for blackoutsecure/bos-repo-about-sync-action.
#
# Optimised for GitHub Actions YAML which uses:
#   * Long inline expressions (${{ ... }}) — line-length relaxed.
#   * Many "on:" / "yes/no" truthy values which yamllint flags by default.

extends: default

ignore: |
  .git/
  .venv/
  node_modules/
  dist/

rules:
  line-length:
    max: 200
    level: warning

  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
    check-keys: false

  braces:
    level: warning

  comments:
    require-starting-space: false
    min-spaces-from-content: 1

  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false

  colons:
    max-spaces-after: -1

  document-start: disable
