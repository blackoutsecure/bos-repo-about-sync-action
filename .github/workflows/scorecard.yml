# OpenSSF Scorecard workflow — supply-chain posture scoring.
#
# Generated by `marketplace-kit generate-policy scorecard-workflow`.
# Drop at `.github/workflows/scorecard.yml`.
#
# Public repos only (free). Results published to https://scorecard.dev.
# SARIF report is uploaded to GHAS code-scanning so Scorecard findings
# surface in the Security tab alongside CodeQL.
#
# bos-repo-about-sync-action maintained by blackoutsecure.

name: scorecard

"on":
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 07:30 UTC.
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # Org-shared runner label; accepts a bare label or a JSON array.
    # Falls back to `ubuntu-latest` when the variable is unset.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to GHAS code-scanning
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
