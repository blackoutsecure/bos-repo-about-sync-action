# Consolidated repo security scan — calls the hub-side reusable
# `blackoutsecure/bos-automation-hub/.github/workflows/security-scan.yml`
# so a SINGLE hub commit can roll out `github/codeql-action` SHA bumps,
# `bos-code-scanning-kit@v1` major pins, and runner-label changes to every
# opted-in repo on next run.
#
# Generated by `marketplace-kit generate-policy code-scan-workflow`.
# Drop at `.github/workflows/bos-launchpad-code-scan.yml` (the org-
# convention name that mirrors the hub reusable's filename so the
# consumer surface stays uniform across kits).
#
# bos-repo-about-sync-action maintained by blackoutsecure.
#
# Replaces what would otherwise be a standalone `codeql.yml` PLUS a
# standalone `self-scan.yml`. The hub reusable runs TWO independent
# sub-jobs from one caller:
#
#   * `scan`   — the published `blackoutsecure/bos-code-scanning-kit@v1`
#                composite: posture audit (PS / CQ / GH / MS / SR rules)
#                + bundled scanners (actionlint / gitleaks / shellcheck)
#                + unified SARIF upload to GHAS code-scanning.
#                Gated by `enable_kit_composite` (default `true`).
#   * `codeql` — `github/codeql-action` matrix analysis. Gated by
#                `codeql_languages` being a non-empty JSON-array string.
#
# Both sub-jobs upload SARIF to this repo's Security tab under distinct
# `category` values so they coexist cleanly without overwriting each
# other's findings.
#
# ────────────────────────────────────────────────────────────────────
# Choose ONE: this workflow OR `codeql.yml`
# ────────────────────────────────────────────────────────────────────
# `marketplace-kit generate-policy codeql-workflow` emits a STANDALONE
# CodeQL workflow that pins `github/codeql-action` SHAs in this repo
# directly. This workflow invokes the same action TRANSITIVELY via the
# hub reusable.
#
# Running BOTH would double CodeQL spend with no extra signal AND make
# SHA-bump rollouts inconsistent (the standalone file would drift from
# the hub). Pick ONE:
#
#   * Use THIS workflow if you want hub-driven SHA rollouts AND the
#     kit composite's posture + scanner coverage in one caller.
#   * Use `codeql.yml` if you want a fully self-contained CodeQL
#     surface with no hub dependency (e.g. an external repo that
#     can't depend on `blackoutsecure/bos-automation-hub`).
#
# When migrating from `codeql.yml` to this workflow, delete the old
# `.github/workflows/codeql.yml` in the same PR. The `marketplace-kit
# install code-scan-workflow` command will warn if both exist.
#
# ────────────────────────────────────────────────────────────────────
# Producer-kit escape hatch
# ────────────────────────────────────────────────────────────────────
# This repo is the PRODUCER of `blackoutsecure/bos-code-scanning-kit@v1`?
# Then set `enable_kit_composite: false` below — running the published
# `@v1` composite against its own dev source is circular self-test.
# Pair that with a `self-scan.yml` that runs `uses: ./` (the in-tree
# composite) for actual coverage of the PR branch.
#
# ────────────────────────────────────────────────────────────────────
# Transitive invocations
# ────────────────────────────────────────────────────────────────────
# Kept inline here so audit tooling and the marketplace-kit CQ001
# detector can see them at this repo's surface (CQ001 only inspects
# top-level workflow files in `.github/workflows/`, not transitive
# reusable callees):
#
#   uses: blackoutsecure/bos-code-scanning-kit@v1
#   uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa    # v4.36.0
#   uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
#
# Bump the SHAs above in lockstep with
# `bos-automation-hub/.github/workflows/security-scan.yml`
# whenever the hub rolls a new pin set. The literal SHAs here are
# documentary only — the hub reusable is the source of truth.
#
# ────────────────────────────────────────────────────────────────────
# SCANNING_PAT — what to put in the secret
# ────────────────────────────────────────────────────────────────────
# `SCANNING_PAT` is optional. When absent, PS002 (secret scanning),
# PS003 (Dependabot alerts), and PS020-PS025 (branch protection) emit
# `skip` findings because `GITHUB_TOKEN` lacks admin reach. Adding the
# PAT upgrades those rows to real `pass`/`fail` evaluations.
#
# Classic PAT: tick ONLY `repo` (top-level). Untick `workflow`,
# `admin:org`, `admin:enterprise`, `delete_repo`, `*:packages`,
# `admin:*_hook`, `gist`, `user`, `audit_log`. Configure SSO →
# Authorize for every SAML-enforced org. See
# https://github.com/blackoutsecure/bos-code-scanning-kit#-scanning_pat--advanced-posture-credentials
# for the full classic + fine-grained checklist.
#
# Storage: this repo's Settings → Secrets and variables → Actions →
# Secrets → `SCANNING_PAT` (or at the org level with this repo in
# the access policy). Rotate ≤90 days.

name: Security scan

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Kit composite fail policy (`fail` | `never`).'
        required: false
        type: choice
        default: 'never'
        options: ['never', 'fail']
      advanced_scanning:
        description: 'Enable advanced posture probes (PS002/PS003) via SCANNING_PAT.'
        required: false
        type: boolean
        default: false
      require_pat:
        description: 'Fail fast if advanced_scanning is requested but SCANNING_PAT is not configured.'
        required: false
        type: boolean
        default: false
      http_timeout:
        description: 'Per-request HTTP timeout (seconds) for kit posture probes. Default 20. Bump on slow self-hosted egress or GH API latency spikes.'
        required: false
        type: string
        default: '20'

permissions:
  contents: read

concurrency:
  group: bos-launchpad-code-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Resolve advanced-PAT mode + verify secret availability before the scan
  # reusable runs. Mirrors the resolution pattern used across the org:
  # dispatch input > repo/org var fallback > absent. `require_pat` enforces
  # fail-fast when the PAT was demanded but missing, preventing silent
  # baseline-only degradation of PS002/PS003 posture probes.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (PAT mode)
    # Org-shared runner label; accepts a bare label or a JSON array.
    # Falls back to `ubuntu-latest` when the variable is unset.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      use_advanced_pat: ${{ steps.mode.outputs.use_advanced_pat }}
    steps:
      - id: mode
        name: Resolve advanced PAT mode
        env:
          INPUT_ADVANCED: ${{ github.event_name == 'workflow_dispatch' && inputs.advanced_scanning && 'true' || '' }}
          INPUT_REQUIRE_PAT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_pat && 'true' || '' }}
          VAR_ADVANCED: ${{ vars['BOS_SCAN_ADVANCED'] }}
          VAR_REQUIRE_PAT: ${{ vars['BOS_SCAN_REQUIRE_PAT'] }}
          HAS_PAT: ${{ secrets['SCANNING_PAT'] != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          is_true() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          advanced_requested=false
          if [ -n "${INPUT_ADVANCED}" ]; then
            advanced_requested=true
          elif is_true "${VAR_ADVANCED}"; then
            advanced_requested=true
          fi

          require_pat=false
          if [ -n "${INPUT_REQUIRE_PAT}" ]; then
            require_pat=true
          elif is_true "${VAR_REQUIRE_PAT}"; then
            require_pat=true
          fi

          use_advanced_pat=false
          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" = "true" ]; then
            use_advanced_pat=true
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" != "true" ] && [ "${require_pat}" = "true" ]; then
            echo "::error::Advanced scanning was requested, but secret SCANNING_PAT is not configured."
            exit 1
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" != "true" ]; then
            echo "::warning::Advanced scanning requested but SCANNING_PAT is missing. Falling back to GITHUB_TOKEN (PS002/PS003 will be skipped)."
          fi

          echo "use_advanced_pat=${use_advanced_pat}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Consolidated scan: kit composite + CodeQL matrix, both via the hub
  # reusable. `secrets: inherit` forwards SCANNING_PAT (if configured at
  # the org/repo level) so the reusable can pass it to the kit composite
  # only when `use_advanced_pat` is true.
  #
  # ╭─ TODO: review `codeql_languages` for bos-repo-about-sync-action ───────────────╮
  # │ The string is parsed by the reusable with `fromJSON` to drive a       │
  # │ matrix, so entries MUST be DOUBLE-QUOTED JSON strings. YAML's flow-   │
  # │ list shorthand `[python, actions]` is REJECTED with                   │
  # │   `fromJSON: Unexpected symbol: 'python'`                             │
  # │ Supported (as of 2025): cpp, csharp, go, java-kotlin,                 │
  # │ javascript-typescript, python, ruby, swift, actions.                  │
  # │ The default below covers a typical Python composite Action; trim or  │
  # │ extend for your stack. Empty string skips CodeQL entirely.            │
  # ╰───────────────────────────────────────────────────────────────────────╯
  #
  # `enable_kit_composite`: leave `true` for the standard consumer case.
  # Flip to `false` ONLY if this repo IS the producer of
  # `blackoutsecure/bos-code-scanning-kit@v1` (see header for rationale).
  # ---------------------------------------------------------------------------
  scan:
    needs: preflight
    uses: blackoutsecure/bos-automation-hub/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      enable_kit_composite: true
      enable_posture:       true
      enable_scanners:      true
      enable_upload:        true
      fail_on:              ${{ inputs.fail_on || 'never' }}
      use_advanced_pat:     ${{ needs.preflight.outputs.use_advanced_pat == 'true' }}
      kit_http_timeout:     ${{ inputs.http_timeout || '20' }}
      codeql_languages:     '["python", "actions"]'
      codeql_queries:       security-and-quality
    secrets: inherit
