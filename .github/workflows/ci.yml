name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: bash -n syntax check
        run: bash -n run.sh lib.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck -x -S error --shell=bash run.sh lib.sh

      - name: pytest
        run: pytest -q

  dry-run-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run action in dry-run mode
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          description: 'Composite GitHub Action that syncs a repo About box from README content or explicit values.'
          homepage: 'https://github.com/blackoutsecure/bos-repo-about-sync-action'
          topics: 'github-actions marketplace repository-metadata readme automation'
          dry_run: 'true'
