# Self-test: run this repo's OWN action against itself in dry-run mode.
# If the action can't validate its own inputs cleanly, it doesn't ship.
# Complements (does not replace) the hub-managed security/action-test
# kickers, which already run ruff, pytest, and shellcheck.
#
# Lives on `dev` only — never promoted (Marketplace publishing blocks
# `.github/workflows/` from reaching `main`; see `.github/bos-universal-config.json`).
name: Self-test · dogfood action against own repo

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          description: 'Composite GitHub Action that syncs a repo About box from README content or explicit values.'
          homepage: 'https://github.com/blackoutsecure/bos-repo-about-sync-action'
          topics: 'github-actions marketplace repository-metadata readme automation'
          dry_run: 'true'
